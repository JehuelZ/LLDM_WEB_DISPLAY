<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- Símbolo de la Flama Oficial LLDM - Versión Blanco Puro (Vector HD) -->
  <defs>
    <filter id="whiteGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#whiteGlow)">
    <!-- Cuerpo Principal de la Flama -->
    <path
      d="M256 44 
         C275 95, 335 155, 335 235 
         C335 305, 295 365, 256 445 
         C217 365, 177 305, 177 235 
         C177 155, 237 95, 256 44 Z"
      fill="#ffffff"
    />

    <!-- Espiral y Curva Interna de Luz de la Flama -->
    <path
      d="M256 120
         C240 160, 215 200, 215 240
         C215 280, 235 320, 256 370
         C277 320, 297 280, 297 240
         C297 200, 272 160, 256 120 Z"
      fill="#0a0a0f"
      opacity="0.25"
    />

    <path
      d="M256 170
         C248 195, 232 225, 232 250
         C232 275, 244 300, 256 335
         C268 300, 280 275, 280 250
         C280 225, 264 195, 256 170 Z"
      fill="#ffffff"
    />

    <!-- Destello Central -->
    <ellipse cx="256" cy="260" rx="14" ry="32" fill="#0a0a0f" opacity="0.3" />
    <ellipse cx="256" cy="260" rx="6" ry="18" fill="#ffffff" />
  </g>
</svg>
