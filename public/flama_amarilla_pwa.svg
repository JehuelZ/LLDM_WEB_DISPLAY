<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- Fondo Oscuro Elegante para PWA App Icon -->
  <rect width="512" height="512" rx="128" fill="#0a0a0f" />

  <defs>
    <linearGradient id="goldFlameGradPWA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef08a;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>

    <filter id="goldGlowPWA" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#goldGlowPWA)" transform="translate(64, 64) scale(0.75)">
    <!-- Cuerpo Principal de la Flama Oficial LLDM -->
    <path
      d="M256 44 
         C275 95, 335 155, 335 235 
         C335 305, 295 365, 256 445 
         C217 365, 177 305, 177 235 
         C177 155, 237 95, 256 44 Z"
      fill="url(#goldFlameGradPWA)"
    />

    <!-- Espiral y Curva Interna de Luz de la Flama -->
    <path
      d="M256 120
         C240 160, 215 200, 215 240
         C215 280, 235 320, 256 370
         C277 320, 297 280, 297 240
         C297 200, 272 160, 256 120 Z"
      fill="#0a0a0f"
      opacity="0.3"
    />

    <path
      d="M256 170
         C248 195, 232 225, 232 250
         C232 275, 244 300, 256 335
         C268 300, 280 275, 280 250
         C280 225, 264 195, 256 170 Z"
      fill="#fef08a"
    />

    <!-- Núcleo central -->
    <ellipse cx="256" cy="260" rx="10" ry="30" fill="#ffffff" />
  </g>
</svg>
